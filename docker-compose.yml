services:
  addon:
    build: .
    env_file: .env
    environment:
      DATA_DIR: /service/data
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - telegram-data:/service/data
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; token=os.getenv('ADDON_TOKEN', ''); prefix='/' + token if token else ''; urllib.request.urlopen('http://127.0.0.1:8000' + prefix + '/health', timeout=5)"
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

volumes:
  telegram-data:
