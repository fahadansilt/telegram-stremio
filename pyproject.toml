[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Per-read deadlines intentionally use asyncio.timeout, rather than a total
# transfer deadline: large movies can stream for hours.
"app/reader.py" = ["ASYNC109"]
